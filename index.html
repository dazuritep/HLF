<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLF</title>
<link rel="icon" href="icon.png">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:sans-serif; background:#111827; color:#f3f4f6; display:flex; min-height:100vh; }

  aside { width:250px; background:#1f2937; padding:24px 16px; position:sticky; top:0; height:100vh; flex-shrink:0; }
  .profile { text-align:center; margin-bottom:24px; }
  .icon { width:96px; height:96px; object-fit:contain; }
  .icon-fallback { width:96px; height:96px; border-radius:16px; background:#374151; font-size:48px;
                   display:none; align-items:center; justify-content:center; margin:0 auto; }
  .profile h2 { margin:10px 0 2px; }
  .profile p { margin:0; color:#9ca3af; font-size:13px; }
  nav button { display:block; width:100%; text-align:left; background:none; border:none; color:#d1d5db;
               font-size:16px; padding:12px 14px; border-radius:10px; cursor:pointer; margin-bottom:4px; }
  nav button:hover { background:#374151; }
  nav button.active { background:#4b5563; color:#fff; font-weight:bold; }

  main { flex:1; padding:32px; max-width:860px; }
  h1 { margin-top:0; }
  .card { background:#1f2937; border-radius:12px; padding:16px 20px; margin-bottom:12px; }
  .card h3 { margin:0 0 6px; }
  .tag { display:inline-block; background:#374151; padding:3px 10px; border-radius:20px; font-size:13px; margin:0 6px 6px 0; }
  .muted { color:#9ca3af; font-size:13px; }
  a { color:#60a5fa; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #374151; }
  th { color:#9ca3af; font-size:13px; }
  .sc { color:#34d399; font-weight:bold; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .stat { background:#1f2937; border-radius:12px; padding:18px; text-align:center; }
  .stat b { display:block; font-size:28px; color:#34d399; margin-top:6px; }
  .video { position:relative; padding-top:56.25%; margin-top:10px; }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; border-radius:10px; }

  @media (max-width:700px) {
    body { flex-direction:column; }
    aside { width:100%; height:auto; position:static; }
    nav { display:flex; flex-wrap:wrap; gap:4px; }
    nav button { width:auto; }
    main { padding:18px; }
  }
</style>
</head>
<body>

<aside>
  <div class="profile">
    <img class="icon" id="icon" src="icon.png" alt="icon"
         onerror="this.style.display='none'; document.getElementById('fb').style.display='flex'">
    <div class="icon-fallback" id="fb">🎮</div>
    <h2 id="pname"></h2>
    <p id="pdesc"></p>
  </div>
  <nav id="nav"></nav>
</aside>

<main id="content"></main>

<script>
  // ▼▼▼ 여기만 고치면 돼요 ▼▼▼

  const profile = { name: "dazuritep", desc: "The Hsiaaal Level Form" };

  // 내 지메 스탯 ["이름", 값]
  const stats = [
    ["별 갯수", 54],
    ["달 갯수", 10],
    ["데몬 클리어 갯수", 3],
    ["유저 코인", 6],
    ["지메 시크릿 코인", 6],
    ["크포", 0]
  ];

  // 내 레벨 (점수 높은 순으로 순위 자동 계산)
  const levels = [
    { name: "만든게없어요ㅜㅜ", id: "12345678", difficulty: "Extreme Demon",   score: 8.5, note: "졤트리" },
    { name: "만든게없어요ㅜㅜ", id: "12345678", difficulty: "Extreme Demon", score: 9.2, note: "졤트리" },
    { name: "만든게없어요ㅜㅜ", id: "12345678", difficulty: "Extreme Demon", score: 7.0, note: "엄엄" }
  ];

  // 포럼 글 (영상 올리려면 한 줄 복사해서 추가)
  // link에 유튜브 주소를 넣으면 영상이 바로 재생되고 없으면 "" 로 두면 됨.
  const posts = [
    { date: "YYYY-MM-DD / APM N:NN ", title: "Untitled", text: "The Text.", link: "" },
    { date: "2026-11-21 / PM 8:00 ", title: "Hsiaaal's From Opened", text: "올리고 싶은거 올립니다.", link: "" },
    { date: "2026-11-21 / PM 8:25 ", title: "Kuzureta FWC", text: "쿠주레타 프레임 윈도우 카운터", link: "https://youtu.be/eUlzLTjPEVs" },
  ];

  // ▲▲▲ 여기까지 ▲▲▲

  const sorted = [...levels].sort((a, b) => b.score - a.score);
  const menus = [
    ["levels", "📋 내 레벨"],
    ["rank", "🏆 순위"],
    ["stats", "📊 내 스탯"],
    ["forum", "💬 포럼"]
  ];
  let current = "levels";

  document.getElementById("pname").textContent = profile.name;
  document.getElementById("pdesc").textContent = profile.desc;

  function ytId(url) {
    const m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  const views = {
    levels: () => `<h1>📋 내 레벨</h1>` + levels.map(l => `
      <div class="card">
        <h3>${l.name}</h3>
        <span class="tag">ID: ${l.id}</span><span class="tag">${l.difficulty}</span><span class="tag">레이팅 ${l.score}</span>
        ${l.note ? `<div class="muted">${l.note}</div>` : ""}
      </div>`).join(""),

    rank: () => `<h1>🏆 순위</h1>
      <table><thead><tr><th>#</th><th>레벨</th><th>난이도</th><th>레이팅</th></tr></thead><tbody>
      ${sorted.map((l, i) => `<tr><td>${i + 1}</td><td>${l.name}</td><td>${l.difficulty}</td><td class="sc">${l.score}</td></tr>`).join("")}
      </tbody></table>`,

    stats: () => `<h1>📊 내 스탯</h1><div class="grid">` +
      stats.map(s => `<div class="stat">${s[0]}<b>${s[1]}</b></div>`).join("") + `</div>`,

    forum: () => `<h1>💬 포럼</h1>` +
      [...posts].sort((a, b) => b.date.localeCompare(a.date)).map(p => {
        const id = p.link ? ytId(p.link) : null;
        return `<div class="card">
          <h3>${p.title}</h3>
          <div class="muted">${p.date}</div>
          <p>${p.text}</p>
          ${id ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen></iframe></div>`
               : p.link ? `<a href="${p.link}" target="_blank">🔗 링크 열기</a>` : ""}
        </div>`;
      }).join("")
  };

  function go(key) {
    current = key;
    document.getElementById("nav").innerHTML = menus.map(m =>
      `<button class="${m[0] === current ? "active" : ""}" onclick="go('${m[0]}')">${m[1]}</button>`).join("");
    document.getElementById("content").innerHTML = views[key]();
  }
  go("levels");
</script>
</body>
</html>
